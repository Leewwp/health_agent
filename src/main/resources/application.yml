spring:
  application:
    name: health-agent
  config:
    # 本地启动时可从仓库根目录 .env 读取配置；系统环境变量和命令行参数优先级更高。
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: legacy diet schema
    locations: classpath:db/migration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
agentscope:
  dashscope:
    # API key 从 DASHSCOPE_API_KEY 读取，可由根目录 .env、系统环境变量或命令行参数提供。
    # 默认空值：dev 未配置时 LLM/embedding 确定性降级；prod 缺失时启动失败。
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
diet:
  seed:
    # 本地完整媒体目录默认不导入；dev profile 在媒体包存在时显式启用。
    local-media-catalog: ${DIET_LOCAL_MEDIA_CATALOG_ENABLED:false}
  llm:
    # 主生成与轻量意图模型可由环境覆盖；默认使用当前百炼账号已授权的 Qwen 系列。
    main-model: ${DIET_LLM_MAIN_MODEL:qwen-turbo}
    light-model: ${DIET_LLM_LIGHT_MODEL:qwen-turbo}
    # 聊天端点形态：false=agentscope 原生 DashScope 端点（默认）；true=OpenAI 兼容端点
    # （/chat/completions，适配只开放兼容端点的 DashScope 专属空间）
    openai-compatible: true
  agent:
    # agentscope=真实 DashScope；fixture=固定夹具（离线演示/测试，无 API key）
    mode: agentscope
    timeout-ms: ${DIET_AGENT_TIMEOUT_MS:15000}
  request:
    # 整轮健康聊天截止时间；模型调用必须消费剩余预算。
    timeout-ms: ${DIET_REQUEST_TIMEOUT_MS:5000}
  plan-generation:
    # 训练计划应用截止时间；模型最多消费其中 80%，为 fallback、Guard 与短事务留出预算。
    timeout-ms: ${DIET_PLAN_GENERATION_TIMEOUT_MS:15000}
  resource:
    # reviewed=数据库审核子集（正式）；fixture=内存种子（离线演示/测试，prod 禁止）
    mode: reviewed
  rag:
    # structured=只用结构化检索；hybrid=结构化+语义合并（embedding 失败自动降级）
    mode: hybrid
    # hybrid 融合权重：结构化分权重（语义分权重 = 1-w），默认 0.5（#77 消融经测试接缝注入，不静默改线上）
    fusion-weight: 0.5
    # 启动时运行 RAG 评估（固定查询集 → data/reports/rag_evaluation.json）
    eval-run: false
    eval-report-path: data/reports/rag_evaluation.json
  embedding:
    # 可独立覆盖的 embedding 端点；DashScope 专属空间的原生与 OpenAI 兼容 base-url 不同（原生 /api/v1），
    # 留空时回退 agentscope.dashscope.base-url
    base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:}
    model: text-embedding-v3
    dimensions: 1024
    timeout-ms: ${DIET_EMBEDDING_TIMEOUT_MS:5000}
    # 启动时是否离线生成餐食向量（需要真实 API key，默认关闭）
    generate-on-startup: false
  vectorstore:
    # in-memory=内存适配器（测试/离线演示，默认）；qdrant=真实 Qdrant（gRPC 明文）
    mode: ${DIET_VECTORSTORE_MODE:in-memory}
    host: ${QDRANT_HOST:localhost}
    grpc-port: ${QDRANT_GRPC_PORT:6334}
    use-tls: false
    timeout-ms: 5000
    # 启动时是否把 MySQL 审核餐食向量批量索引到向量存储（需要已生成 meal_item_embedding，默认关闭）
    index-on-startup: false
    # collection 身份（provider+model+dimension+version）：model/dimension 默认跟随
    # diet.embedding.*（切换 embedding 模型/维度时自动换 collection 身份），可显式覆盖
    provider: dashscope
  prompt:
    version: v1
  session:
    max-history-turns: 10
  security:
    session-cookie-name: HEALTH_SESSION
    session-secret: ${DIET_SESSION_SECRET:dev-only-change-me}
    cookie-secure: false
    allow-legacy-user-header: true
    admin-protected: false
    admin-token: ${ADMIN_TOKEN:}
  mcp:
    # MCP Streamable HTTP 端点（M5 #51）：/mcp 挂载传输与独立安全 Filter。
    # api-token 未配置时端点 fail-closed 拒绝所有请求（无 MCP OAuth 2.1 声明）
    endpoint: /mcp
    api-token: ${MCP_API_TOKEN:}
    # 逗号分隔的 Origin allowlist（#61：非空 Origin 必须精确命中；为空不再表达任意来源，
    # 空 allowlist + 非空 Origin 一律 403，prod 启用 token 时禁止空 allowlist）
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
    # 缺失 Origin（curl/MCP Inspector/受控服务端客户端）是否放行：#61 默认 fail-closed（false），
    # dev 在 application-dev.yml 显式放行本地 Inspector；生产如确需放行必须显式配置并自担风险
    allow-missing-origin: ${DIET_MCP_ALLOW_MISSING_ORIGIN:false}
logging:
  level:
    com.diet: INFO
