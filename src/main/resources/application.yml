spring:
  application:
    name: health-agent
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: legacy diet schema
    locations: classpath:db/migration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:请填入自己的apiKey}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
diet:
  llm:
    main-model: qwen-max
    light-model: qwen-turbo
    # 聊天端点形态：false=agentscope 原生 DashScope 端点（默认）；true=OpenAI 兼容端点
    # （/chat/completions，适配只开放兼容端点的 DashScope 专属空间）
    openai-compatible: false
  agent:
    # agentscope=真实 DashScope；fixture=固定夹具（离线演示/测试，无 API key）
    mode: agentscope
    timeout-ms: 15000
  resource:
    # reviewed=数据库审核子集（正式）；fixture=内存种子（离线演示/测试，prod 禁止）
    mode: reviewed
  rag:
    # structured=只用结构化检索；hybrid=结构化+语义合并（embedding 失败自动降级）
    mode: hybrid
    # 启动时运行 RAG 评估（固定查询集 → data/reports/rag_evaluation.json）
    eval-run: false
    eval-report-path: data/reports/rag_evaluation.json
  embedding:
    # 可独立覆盖的 embedding 端点；DashScope 专属空间的原生与 OpenAI 兼容 base-url 不同（原生 /api/v1），
    # 留空时回退 agentscope.dashscope.base-url
    base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:}
    model: text-embedding-v3
    dimensions: 1024
    timeout-ms: 5000
    # 启动时是否离线生成餐食向量（需要真实 API key，默认关闭）
    generate-on-startup: false
  prompt:
    version: v1
  session:
    max-history-turns: 10
  security:
    session-cookie-name: HEALTH_SESSION
    session-secret: ${DIET_SESSION_SECRET:dev-only-change-me}
    cookie-secure: false
    allow-legacy-user-header: true
    admin-protected: false
    admin-token: ${ADMIN_TOKEN:}
logging:
  level:
    com.diet: INFO
