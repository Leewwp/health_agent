spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}

diet:
  agent:
    # 生产环境必须使用真实模型，禁止固定夹具
    mode: agentscope
  security:
    session-secret: ${DIET_SESSION_SECRET}
    cookie-secure: true
    allow-legacy-user-header: false
    admin-protected: true
    admin-token: ${ADMIN_TOKEN}
  mcp:
    # #61：prod 缺失 Origin 必须 fail-closed（安全默认值）；如确需放行须显式改 true 并自担风险
    allow-missing-origin: false
