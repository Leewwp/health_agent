<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>健身动作展示原型</title>
    <style>
        :root {
            --ink: #182329;
            --muted: #69767a;
            --paper: #f4f6f3;
            --surface: #ffffff;
            --line: #dce3df;
            --teal: #176b67;
            --teal-soft: #dcefea;
            --orange: #d86b32;
            --orange-soft: #fff0e4;
            --yellow: #e6b84d;
            --yellow-soft: #fff7d9;
            --blue: #3f6d9e;
            --blue-soft: #e8f0fa;
            --shadow: 0 18px 50px rgba(24, 35, 41, .10);
            --shadow-small: 0 8px 24px rgba(24, 35, 41, .08);
            --radius: 14px;
        }

        * { box-sizing: border-box; }
        html { color-scheme: light; background: var(--paper); }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 3px solid rgba(216, 107, 50, .28);
            outline-offset: 2px;
        }
        a { color: inherit; }

        .prototype-shell { min-height: 100vh; padding: 24px 24px 104px; }
        .prototype-head, .workspace, .conversation-shell, .plan-shell {
            width: min(1380px, 100%);
            margin: 0 auto;
        }
        .prototype-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
        .eyebrow { color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1, h2, h3, p { margin-top: 0; }
        h1 { max-width: 720px; margin-bottom: 8px; font-size: clamp(30px, 4vw, 54px); line-height: 1.05; letter-spacing: -.04em; }
        h2 { margin-bottom: 4px; font-size: 22px; letter-spacing: -.025em; }
        h3 { margin-bottom: 2px; font-size: 16px; }
        .lede { max-width: 670px; margin-bottom: 0; color: var(--muted); font-size: 16px; }
        .head-metrics { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 430px; }
        .metric { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.7); color: var(--muted); }
        .metric strong { margin-right: 4px; color: var(--ink); font-size: 16px; }

        .button, .icon-button, .filter-button, .tab-button, .switch-button {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            transition: 160ms ease;
        }
        .button { min-height: 40px; padding: 9px 14px; border-radius: 9px; font-weight: 750; }
        .button:hover, .filter-button:hover, .tab-button:hover, .switch-button:hover { border-color: var(--teal); color: var(--teal); }
        .button.primary { border-color: var(--teal); color: #fff; background: var(--teal); }
        .button.primary:hover { background: #0e5753; }
        .button.soft { border-color: transparent; background: var(--teal-soft); color: var(--teal); }
        .button[disabled] { cursor: not-allowed; opacity: .46; }
        .button.small { min-height: 34px; padding: 7px 10px; font-size: 13px; }
        .icon-button { display: inline-grid; width: 34px; height: 34px; place-items: center; border-radius: 9px; font-size: 20px; line-height: 1; }
        .icon-button.is-favorite { border-color: #f4d27e; color: #a26a00; background: var(--yellow-soft); }

        .workspace { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 18px; align-items: start; }
        .filter-rail { position: sticky; top: 20px; display: grid; gap: 18px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-small); }
        .filter-rail h2 { font-size: 17px; }
        .filter-group { display: grid; gap: 7px; }
        .filter-label { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .04em; }
        .filter-control { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fbfcfb; }
        .filter-note { padding: 11px; border-left: 3px solid var(--orange); color: var(--muted); background: var(--orange-soft); font-size: 12px; }
        .scope-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 10px; background: var(--paper); }
        .tab-button { min-height: 34px; padding: 6px 5px; border-color: transparent; border-radius: 7px; font-size: 12px; }
        .tab-button.active { border-color: var(--line); background: #fff; color: var(--teal); font-weight: 800; box-shadow: 0 2px 8px rgba(24, 35, 41, .06); }

        .content-column { min-width: 0; }
        .content-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
        .toolbar-copy { color: var(--muted); }
        .toolbar-copy strong { color: var(--ink); }
        .toolbar-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
        .exercise-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
        .exercise-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-small); }
        .exercise-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .exercise-card-body { display: grid; gap: 9px; padding: 13px; }
        .exercise-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .exercise-card h3 { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .english-name { color: var(--muted); font-size: 11px; }
        .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
        .tag { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 7px; border-radius: 999px; color: var(--muted); background: #eff3f1; font-size: 11px; }
        .tag.orange { color: #9c4c20; background: var(--orange-soft); }
        .tag.teal { color: var(--teal); background: var(--teal-soft); }
        .tag.blue { color: #355e8d; background: var(--blue-soft); }
        .tag.yellow { color: #896000; background: var(--yellow-soft); }
        .status-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
        .status-line strong { color: var(--teal); }

        .media-frame { position: relative; display: grid; min-height: 164px; aspect-ratio: 4 / 3; place-items: center; overflow: hidden; background: #e8eeeb; }
        .media-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .media-frame img[hidden] { display: none; }
        .media-fallback { position: absolute; inset: 0; display: none; place-items: center; padding: 22px; color: var(--muted); background: repeating-linear-gradient(135deg, #eef2ef, #eef2ef 12px, #e5ebe7 12px, #e5ebe7 24px); text-align: center; }
        .media-frame.is-broken .media-fallback { display: grid; }
        .media-badge { position: absolute; top: 10px; left: 10px; padding: 4px 7px; border-radius: 6px; color: #fff; background: rgba(24, 35, 41, .72); font-size: 11px; font-weight: 800; letter-spacing: .04em; }
        .media-credit { position: absolute; right: 9px; bottom: 7px; padding: 2px 5px; border-radius: 4px; color: rgba(255,255,255,.92); background: rgba(24, 35, 41, .62); font-size: 10px; }
        .media-frame.is-broken .media-credit { color: var(--muted); background: rgba(255,255,255,.72); }

        .empty-state { grid-column: 1 / -1; padding: 44px 20px; border: 1px dashed #bac8c2; border-radius: var(--radius); color: var(--muted); background: rgba(255,255,255,.5); text-align: center; }

        .conversation-shell { display: grid; grid-template-columns: minmax(0, 1.1fr) 290px; gap: 18px; }
        .conversation-panel { min-height: 690px; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: #fbfcfb; box-shadow: var(--shadow); }
        .conversation-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
        .conversation-list { display: grid; gap: 20px; padding: 24px 4px 90px; }
        .message-row { display: flex; gap: 11px; align-items: flex-start; }
        .message-row.user { justify-content: flex-end; }
        .avatar { display: grid; flex: 0 0 34px; width: 34px; height: 34px; place-items: center; border-radius: 9px; color: #fff; background: var(--teal); font-weight: 800; }
        .message-row.user .avatar { order: 2; background: var(--orange); }
        .message-body { max-width: min(620px, 88%); }
        .message-label { margin-bottom: 4px; color: var(--muted); font-size: 11px; }
        .message-bubble { padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
        .message-row.user .message-bubble { color: #fff; border-color: var(--orange); background: var(--orange); }
        .recommendation-block { margin-top: 12px; padding: 11px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
        .recommendation-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-size: 12px; font-weight: 800; }
        .mini-action { display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
        .mini-action + .mini-action { margin-top: 7px; }
        .mini-action .media-frame { min-height: 64px; aspect-ratio: 4 / 3; border-radius: 7px; }
        .mini-action .media-badge, .mini-action .media-credit { display: none; }
        .mini-action h3 { margin: 0; font-size: 13px; }
        .composer { position: sticky; bottom: 78px; display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.92); box-shadow: var(--shadow-small); }
        .composer input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--muted); background: transparent; }
        .saved-rail { display: grid; align-content: start; gap: 14px; }
        .rail-panel { padding: 17px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-small); }
        .rail-panel h2 { font-size: 16px; }
        .saved-list { display: grid; gap: 8px; }
        .saved-item { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 9px; background: var(--paper); }
        .saved-item .dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--yellow); }
        .saved-item button { padding: 0; border: 0; color: var(--ink); background: transparent; text-align: left; }

        .plan-shell { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
        .plan-column, .pool-column { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
        .plan-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .plan-header p { margin-bottom: 0; color: var(--muted); }
        .plan-day { display: grid; gap: 9px; padding: 14px 0; border-top: 1px solid var(--line); }
        .plan-day:first-of-type { border-top: 0; }
        .day-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .day-label strong { font-size: 13px; }
        .day-label span { color: var(--muted); font-size: 12px; }
        .plan-action { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfb; }
        .plan-action .media-frame { min-height: 52px; aspect-ratio: 1 / 1; border-radius: 7px; }
        .plan-action .media-badge, .plan-action .media-credit { display: none; }
        .plan-action p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
        .workout-set { display: grid; gap: 11px; padding: 15px 0; border-top: 1px solid var(--line); }
        .workout-set:first-of-type { border-top: 0; }
        .workout-set-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .workout-set-header p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
        .workout-set-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
        .workout-set-summary strong { color: var(--ink); font-size: 16px; }
        .workout-action-list { display: grid; gap: 8px; }
        .workout-action { display: grid; grid-template-columns: 26px 62px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfb; }
        .workout-action .media-frame { min-height: 56px; aspect-ratio: 1 / 1; border-radius: 7px; }
        .workout-action .media-badge, .workout-action .media-credit { display: none; }
        .workout-action h3 { margin: 0; font-size: 13px; }
        .workout-action p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
        .workout-action-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
        .workout-action-controls .button { min-height: 32px; padding: 6px 8px; font-size: 11px; }
        .workout-set-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
        .workout-set-footer .toolbar-copy { font-size: 11px; }
        .drag-handle { display: inline-grid; width: 26px; height: 26px; place-items: center; border-radius: 7px; color: var(--muted); background: #edf1ef; font-size: 17px; line-height: 1; cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .workout-action.is-dragging, .pool-item.is-dragging { opacity: .42; }
        .workout-set[data-drop-target="workout"], .workout-action[data-drop-target="action"] { transition: border-color 160ms ease, background 160ms ease; }
        .workout-set.is-drag-over { border: 2px dashed var(--teal); border-radius: 11px; background: var(--teal-soft); }
        .workout-action.is-drag-over { border-color: var(--orange); background: var(--orange-soft); }
        .schedule-day { display: grid; gap: 10px; padding: 15px 0; border-top: 1px solid var(--line); }
        .schedule-day:first-of-type { border-top: 0; }
        .schedule-day-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .schedule-day-header strong { font-size: 16px; }
        .schedule-day-header p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
        .schedule-block { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 9px; align-items: stretch; }
        .schedule-block-label { display: grid; align-content: start; justify-items: center; gap: 4px; padding-top: 11px; color: var(--muted); font-size: 11px; }
        .schedule-block-icon { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 8px; color: var(--teal); background: var(--teal-soft); font-size: 12px; font-weight: 800; }
        .schedule-block.meal .schedule-block-icon { color: #9c4c20; background: var(--orange-soft); }
        .schedule-block.rest .schedule-block-icon { color: #896000; background: var(--yellow-soft); }
        .schedule-block-content { min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fbfcfb; }
        .schedule-block-content h3 { margin: 0; font-size: 13px; }
        .schedule-block-content p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
        .schedule-block.workout-slot .schedule-block-content { padding: 0 12px; }
        .schedule-block.workout-slot .workout-set { padding: 12px 0; border-top: 0; }
        .schedule-block.workout-slot .workout-set.is-drag-over { padding: 11px; }
        .plan-column.is-dragging .schedule-block.workout-slot .schedule-block-content { border-color: #c7d9d3; }
        .pool-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
        .pool-tabs .tab-button { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
        .pool-tabs .tab-button.active { border-color: var(--teal); background: var(--teal-soft); }
        .pool-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .pool-item { display: grid; grid-template-columns: 26px 82px minmax(0, 1fr); gap: 8px; align-items: center; padding: 9px; border: 1px solid var(--line); border-radius: 11px; background: #fbfcfb; }
        .drag-placeholder { display: block; width: 26px; height: 26px; }
        .pool-item[draggable="true"] { cursor: grab; }
        .pool-item[draggable="true"]:active { cursor: grabbing; }
        .pool-item .media-frame { min-height: 72px; aspect-ratio: 1 / 1; border-radius: 7px; }
        .pool-item .media-badge, .pool-item .media-credit { display: none; }
        .pool-item h3 { margin-bottom: 5px; font-size: 13px; }
        .pool-item .button { margin-top: 8px; }
        .review-status { display: inline-flex; padding: 3px 6px; border-radius: 5px; font-size: 10px; font-weight: 800; }
        .review-status.approved { color: var(--teal); background: var(--teal-soft); }
        .review-status.browse { color: var(--muted); background: #edf0ef; }

        .drawer-backdrop { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: flex-end; background: rgba(24, 35, 41, .36); }
        .detail-drawer { width: min(510px, 100%); height: 100%; overflow: auto; padding: 22px; background: var(--surface); box-shadow: -20px 0 50px rgba(24, 35, 41, .16); animation: slide-in 180ms ease-out; }
        @keyframes slide-in { from { transform: translateX(24px); opacity: .5; } to { transform: translateX(0); opacity: 1; } }
        .drawer-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
        .drawer-kicker { color: var(--muted); font-size: 12px; }
        .drawer-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 15px 0 4px; }
        .drawer-title h2 { margin: 0; font-size: 28px; }
        .drawer-title .icon-button { flex: 0 0 auto; }
        .drawer-subtitle { margin-bottom: 14px; color: var(--muted); }
        .drawer-section { padding: 16px 0; border-top: 1px solid var(--line); }
        .drawer-section h3 { margin-bottom: 9px; font-size: 13px; }
        .step-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: steps; }
        .step-list li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; color: var(--muted); }
        .step-list li::before { display: grid; width: 22px; height: 22px; place-items: center; border-radius: 6px; color: var(--teal); background: var(--teal-soft); counter-increment: steps; content: counter(steps); font-size: 11px; font-weight: 800; }
        .drawer-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin: 0; }
        .drawer-fact { padding: 10px; border-radius: 9px; background: var(--paper); }
        .drawer-fact dt { color: var(--muted); font-size: 11px; }
        .drawer-fact dd { margin: 3px 0 0; font-weight: 800; }
        .drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 18px; }
        .drawer-disclaimer { margin: 15px 0 0; color: var(--muted); font-size: 11px; }

        .prototype-switcher { position: fixed; right: 50%; bottom: 18px; z-index: 40; display: flex; align-items: center; gap: 9px; transform: translateX(50%); padding: 8px 10px; border: 1px solid #31444a; border-radius: 14px; color: #fff; background: #182329; box-shadow: 0 12px 30px rgba(24,35,41,.25); }
        .switch-button { display: grid; width: 34px; height: 34px; place-items: center; border-color: #48636a; border-radius: 8px; color: #fff; background: #26373d; font-size: 20px; }
        .switch-button:hover { border-color: #fff; color: #fff; }
        .switch-label { min-width: 154px; text-align: center; }
        .switch-label strong, .switch-label small { display: block; }
        .switch-label small { color: #aec0c2; font-size: 10px; }

        .toast { position: fixed; right: 24px; bottom: 86px; z-index: 50; max-width: 330px; padding: 11px 14px; border-radius: 9px; color: #fff; background: #182329; box-shadow: var(--shadow-small); opacity: 0; pointer-events: none; transform: translateY(8px); transition: 160ms ease; }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 1120px) {
            .exercise-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 840px) {
            .prototype-shell { padding: 18px 14px 104px; }
            .prototype-head { display: block; }
            .head-metrics { justify-content: flex-start; margin-top: 16px; }
            .workspace, .conversation-shell, .plan-shell { grid-template-columns: 1fr; }
            .filter-rail { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; }
            .filter-rail > h2, .filter-note { grid-column: 1 / -1; }
            .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .saved-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 520px) {
            h1 { font-size: 36px; }
            .filter-rail { grid-template-columns: 1fr; }
            .exercise-grid, .pool-list, .saved-rail { grid-template-columns: 1fr; }
            .content-toolbar { display: block; }
            .toolbar-actions { justify-content: flex-start; margin-top: 10px; }
            .mini-action { grid-template-columns: 72px minmax(0, 1fr); }
            .workout-action { grid-template-columns: 26px 72px minmax(0, 1fr); }
            .mini-action > .button { grid-column: 2; justify-self: start; }
            .workout-action-controls { grid-column: 3; justify-content: flex-start; }
            .pool-item { grid-template-columns: 26px 72px minmax(0, 1fr); }
            .schedule-block { grid-template-columns: 42px minmax(0, 1fr); }
            .detail-drawer { padding: 16px; }
            .prototype-switcher { width: calc(100% - 28px); justify-content: space-between; }
            .switch-label { min-width: 0; }
        }
    </style>
</head>
<body>
<main id="prototype" class="prototype-shell"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
    "use strict";

    // 这是一次性的静态交互原型：状态只保存在内存，数据字段模拟健身动作数据集。
    const demoSvg = (tone, figure) => "data:image/svg+xml," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
            <rect width="640" height="480" fill="${tone}"/>

    function poolItemHtml(action) {
        const draggable = action.approved ? "true" : "false";
        return `<article class="pool-item" draggable="${draggable}" data-drag-type="pool-action" data-action-id="${action.id}">${action.approved ? `<span class="drag-handle" title="拖拽到训练套组" aria-label="拖拽到训练套组">↕</span>` : `<span class="drag-placeholder" aria-hidden="true"></span>`}${mediaHtml(action, "pool") }<div><h3>${escapeHtml(action.name)}</h3>${eligibilityHtml(action)}<button class="button small" data-action="open" data-id="${action.id}" data-context="pool">查看动作</button></div></article>`;
    }

    function variantC() {
        const pool = state.planPool === "candidate" ? actions.filter((action) => action.approved) : state.planPool === "favorites" ? actions.filter((action) => state.favorites.has(action.id)) : actions;
        const poolContent = pool.length ? pool.map(poolItemHtml).join("") : `<div class="empty-state">还没有收藏动作。先在全量浏览里收藏几项，再回到这里整理。</div>`;
        return `${headerHtml("计划 / 03", "一套训练由几个动作组成", "每次训练以套组为单位生成；日期只是容器，训练、餐饮和午休都可以作为同一天的独立内容。把动作拖到套组里加入，拖动套组内动作调整顺序。")}
            <section class="plan-shell"><div class="plan-column"><div class="plan-header"><div><h2>本周计划草稿</h2><p>START_LOW · 3 个训练日 · ${workoutSets.length} 套动作</p></div><span class="tag yellow">计划草稿</span></div>${scheduleDays.map(scheduleDayHtml).join("")}<div style="padding-top:14px"><button class="button primary" data-action="toast" data-message="套组草稿仍在本地，尚未激活">确认本周草稿</button></div></div><div class="pool-column"><div class="plan-header"><div><h2>动作池</h2><p>查看动作，或拖拽入计划套组</p></div><span class="tag teal">${pool.length} 项</span></div><div class="pool-tabs"><button class="tab-button ${state.planPool === "candidate" ? "active" : ""}" data-action="pool" data-pool="candidate">入门候选 · ${actions.filter((action) => action.approved).length}</button><button class="tab-button ${state.planPool === "all" ? "active" : ""}" data-action="pool" data-pool="all">全量浏览 · 1,324</button><button class="tab-button ${state.planPool === "favorites" ? "active" : ""}" data-action="pool" data-pool="favorites">收藏动作 · ${state.favorites.size}</button></div><div class="pool-list">${poolContent}</div></div></section>`;
    }

    function drawerHtml() {
        if (!state.drawerId) return "";
        const action = getAction(state.drawerId);
        const planAllowed = action.approved;
        return `<div class="drawer-backdrop" data-action="close"><aside class="detail-drawer" role="dialog" aria-modal="true" aria-label="${escapeHtml(action.name)}详情"><div class="drawer-top"><span class="drawer-kicker">动作详情 · ${state.drawerContext === "chat" ? "对话推荐" : state.drawerContext === "plan" ? "计划套组" : "动作资料"}</span><button class="icon-button" data-action="close" aria-label="关闭详情">×</button></div>${mediaHtml(action, "drawer") }<div class="drawer-title"><h2>${escapeHtml(action.name)}</h2>${favoriteHtml(action)}</div><p class="drawer-subtitle">${escapeHtml(action.english)}</p>${tagsHtml(action)}<div class="drawer-section"><h3>动作信息</h3><dl class="drawer-facts"><div class="drawer-fact"><dt>训练部位</dt><dd>${escapeHtml(action.body)}</dd></div><div class="drawer-fact"><dt>器材</dt><dd>${escapeHtml(action.equipment)}</dd></div><div class="drawer-fact"><dt>目标肌群</dt><dd>${escapeHtml(action.target)}</dd></div><div class="drawer-fact"><dt>动作模式</dt><dd>${escapeHtml(action.pattern)}</dd></div></dl></div><div class="drawer-section"><h3>中文步骤</h3><ol class="step-list">${action.steps.map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ol></div><div class="drawer-section"><h3>进入计划</h3><p style="margin-bottom:0">${planAllowed ? `<span class="review-status approved">入门候选 · 可进入计划</span>` : `<span class="review-status browse">暂不作为入门候选</span><br><span class="drawer-kicker">仍可浏览和收藏；收藏只表达偏好，不改变计划资格。</span>`}</p></div><div class="drawer-actions"><button class="button" data-action="close">返回当前页面</button></div><p class="drawer-disclaimer">动作说明来自数据集展示字段；原型不对难度、禁忌或训练剂量作医疗判断。媒体署名保留在媒体展示位内。</p></aside></div>`;
    }

    function switcherHtml() {
        const current = variants.find((variant) => variant.key === state.variant);
        return `<nav class="prototype-switcher" aria-label="原型变体切换"><button class="switch-button" data-action="variant-prev" aria-label="上一个变体">‹</button><span class="switch-label"><strong>${current.key.toUpperCase()} · ${current.name}</strong><small>${current.hint} · ← → 切换</small></span><button class="switch-button" data-action="variant-next" aria-label="下一个变体">›</button></nav>`;
    }

    function render() {
        const page = state.variant === "a" ? variantA() : state.variant === "b" ? variantB() : variantC();
        prototype.innerHTML = page + drawerHtml() + switcherHtml();
        document.title = `健身动作展示原型 · ${variants.find((variant) => variant.key === state.variant).name}`;
    }

    function setVariant(key) {
        state.variant = key;
        const url = new URL(location.href);
        url.searchParams.set("variant", key);
        history.replaceState({}, "", url);
        state.drawerId = null;
        render();
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    prototype.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "variant-prev" || action === "variant-next") {
            const index = variants.findIndex((variant) => variant.key === state.variant);
            const nextIndex = action === "variant-next" ? (index + 1) % variants.length : (index - 1 + variants.length) % variants.length;
            setVariant(variants[nextIndex].key);
        } else if (action === "open") {
            state.drawerId = target.dataset.id;
            state.drawerContext = target.dataset.context || "browse";
            render();
        } else if (action === "toggle-workout") {
            const workoutId = target.dataset.workout;
            state.expandedWorkouts.has(workoutId) ? state.expandedWorkouts.delete(workoutId) : state.expandedWorkouts.add(workoutId);
            render();
        } else if (action === "adjust-volume") {
            const workout = getWorkout(target.dataset.workout);
            const item = workout?.items.find((candidate) => candidate.id === target.dataset.item);
            if (!item) return;
            item.sets = item.sets === 3 ? 4 : item.sets === 4 ? 2 : 3;
            item.rest = item.rest === 90 ? 120 : item.rest === 120 ? 60 : 90;
            render();
            showToast(`${getAction(item.actionId).name} 已调整为 ${item.sets} 组、${item.rest} 秒组间休息，套组总时长已更新`);
        } else if (action === "remove-action") {
            const workout = getWorkout(target.dataset.workout);
            if (!workout || workout.items.length <= 1) {
                showToast("每个动作套组至少保留一个动作");
                return;
            }
            const index = workout.items.findIndex((candidate) => candidate.id === target.dataset.item);
            if (index < 0) return;
            const [removed] = workout.items.splice(index, 1);
            render();
            showToast(`${getAction(removed.actionId).name} 已从套组移除，套组总时长已更新`);
        } else if (action === "close") {
            if (target.classList.contains("drawer-backdrop") && event.target !== target) return;
            state.drawerId = null;
            render();
        } else if (action === "favorite") {
            const id = target.dataset.id;
            state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
            showToast(state.favorites.has(id) ? "已收藏，可在对话和计划页继续使用" : "已取消收藏");
            render();
        } else if (action === "scope") {
            state.scope = target.dataset.scope;
            render();
        } else if (action === "pool") {
            state.planPool = target.dataset.pool;
            render();
        } else if (action === "clear-filters") {
            state.scope = "all"; state.body = "全部部位"; state.equipment = "全部器材"; state.target = "全部目标"; state.search = "";
            render();
        } else if (action === "force-failure") {
            state.drawerId = "deadlift"; state.drawerContext = "browse"; render();
            showToast("已打开媒体失败示例，展示位保持固定比例");
        } else if (action === "toast") {
            showToast(target.dataset.message || "已记录");
        }
    });

    function clearDragStyles() {
        prototype.querySelectorAll(".is-dragging, .is-drag-over").forEach((node) => node.classList.remove("is-dragging", "is-drag-over"));
    }

    function workoutIdForDropTarget(target) {
        return target?.dataset.workout || target?.closest('[data-drop-target="workout"]')?.dataset.workout;
    }

    function scheduleAutoCollapse(workoutId) {
        if (!state.drag?.autoExpandedWorkouts.has(workoutId)) return;
        clearTimeout(state.drag.leaveTimer);
        state.drag.leaveTimer = setTimeout(() => {
            if (!state.drag || state.drag.dropped || state.drag.hoveredWorkoutId === workoutId) return;
            state.expandedWorkouts.delete(workoutId);
            state.drag.autoExpandedWorkouts.delete(workoutId);
            render();
        }, 60);
    }

    prototype.addEventListener("dragstart", (event) => {
        const source = event.target.closest("[draggable=\"true\"]");
        if (!source) return;
        state.drag = {
            type: source.dataset.dragType,
            actionId: source.dataset.actionId,
            workoutId: source.dataset.workout,
            itemId: source.dataset.item,
            autoExpandedWorkouts: new Set(),
            hoveredWorkoutId: null,
            leaveTimer: null,
            dropped: false
        };
        event.dataTransfer.effectAllowed = source.dataset.dragType === "pool-action" ? "copy" : "move";
        event.dataTransfer.setData("text/plain", JSON.stringify(state.drag));
        source.classList.add("is-dragging");
    });

    function handleDragOver(event) {
        const actionTarget = event.target.closest("[data-drop-target=\"action\"]");
        const workoutTarget = event.target.closest("[data-drop-target=\"workout\"]");
        const dropTarget = actionTarget || workoutTarget;
        if (!dropTarget) return;
        event.preventDefault();
        const workoutId = workoutIdForDropTarget(dropTarget);
        if (state.drag) {
            state.drag.hoveredWorkoutId = workoutId;
            clearTimeout(state.drag.leaveTimer);
        }

        if (workoutTarget && !state.expandedWorkouts.has(workoutId)) {
            state.drag?.autoExpandedWorkouts.add(workoutId);
            state.expandedWorkouts.add(workoutId);
            render();
            prototype.querySelector(`[data-drop-target="workout"][data-workout="${workoutId}"]`)?.classList.add("is-drag-over");
            return;
        }

        event.dataTransfer.dropEffect = state.drag?.type === "pool-action" ? "copy" : "move";
        prototype.querySelectorAll(".is-drag-over").forEach((node) => node.classList.remove("is-drag-over"));
        dropTarget.classList.add("is-drag-over");
    }

    prototype.addEventListener("dragenter", handleDragOver);
    prototype.addEventListener("dragover", handleDragOver);

    prototype.addEventListener("dragleave", (event) => {
        const dropTarget = event.target.closest("[data-drop-target=\"action\"], [data-drop-target=\"workout\"]");
        if (!dropTarget) return;
        const workoutSet = dropTarget.closest('[data-drop-target="workout"]');
        if (event.relatedTarget && workoutSet?.contains(event.relatedTarget)) return;
        dropTarget.classList.remove("is-drag-over");
        const workoutId = workoutIdForDropTarget(dropTarget);
        if (state.drag) {
            state.drag.hoveredWorkoutId = null;
            scheduleAutoCollapse(workoutId);
        }
    });

    prototype.addEventListener("drop", (event) => {
        const actionTarget = event.target.closest("[data-drop-target=\"action\"]");
        const workoutTarget = event.target.closest("[data-drop-target=\"workout\"]");
        const dropTarget = actionTarget || workoutTarget;
        if (!dropTarget) return;
        event.preventDefault();
        const payload = state.drag || JSON.parse(event.dataTransfer.getData("text/plain") || "{}");
        const targetWorkout = getWorkout(actionTarget?.dataset.workout || workoutTarget?.dataset.workout);
        if (!targetWorkout || !payload.actionId) {
            clearDragStyles();
            return;
        }

        if (payload.type === "pool-action") {
            const action = getAction(payload.actionId);
            if (!action?.approved) {
                showToast("这项动作可以浏览和收藏，但暂时不能拖入计划");
                clearDragStyles();
                return;
            }
            const newItem = { id: `${targetWorkout.id}-drag-${Date.now()}`, actionId: action.id, sets: 2, reps: "8–12 次", rest: 60, workMinutes: 5 };
            const targetIndex = actionTarget ? targetWorkout.items.findIndex((item) => item.id === actionTarget.dataset.item) : -1;
            if (targetIndex >= 0) targetWorkout.items.splice(targetIndex, 0, newItem);
            else targetWorkout.items.push(newItem);
            state.expandedWorkouts.add(targetWorkout.id);
            state.drag && (state.drag.dropped = true);
            render();
            showToast(`${action.name} 已拖入${targetWorkout.title}，套组总时长已更新`);
        } else if (payload.type === "plan-action") {
            const sourceWorkout = getWorkout(payload.workoutId);
            const sourceIndex = sourceWorkout?.items.findIndex((item) => item.id === payload.itemId);
            if (!sourceWorkout || sourceIndex < 0) {
                clearDragStyles();
                return;
            }
            const [movedItem] = sourceWorkout.items.splice(sourceIndex, 1);
            let targetIndex = actionTarget ? targetWorkout.items.findIndex((item) => item.id === actionTarget.dataset.item) : targetWorkout.items.length;
            if (sourceWorkout === targetWorkout && targetIndex > sourceIndex) targetIndex -= 1;
            targetWorkout.items.splice(Math.max(0, targetIndex), 0, movedItem);
            state.expandedWorkouts.add(targetWorkout.id);
            state.drag && (state.drag.dropped = true);
            render();
            showToast(`${getAction(movedItem.actionId).name} 已调整到${targetWorkout.title}，套组总时长已更新`);
        }
        state.drag = null;
        clearDragStyles();
    });

    prototype.addEventListener("dragend", () => {
        if (state.drag) {
            clearTimeout(state.drag.leaveTimer);
            if (!state.drag.dropped) {
                state.drag.autoExpandedWorkouts.forEach((workoutId) => state.expandedWorkouts.delete(workoutId));
                if (state.drag.autoExpandedWorkouts.size) render();
            }
        }
        state.drag = null;
        clearDragStyles();
    });

    prototype.addEventListener("input", (event) => {
        const target = event.target.closest("[data-filter]");
        if (!target) return;
        state[target.dataset.filter] = target.value;
        if (target.dataset.filter === "search") {
            clearTimeout(state.searchTimer);
            state.searchTimer = setTimeout(render, 180);
        }
    });
    prototype.addEventListener("change", (event) => {
        const target = event.target.closest("[data-filter]");
        if (!target) return;
        state[target.dataset.filter] = target.value;
        render();
    });
    document.addEventListener("keydown", (event) => {
        if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const index = variants.findIndex((variant) => variant.key === state.variant);
        const nextIndex = event.key === "ArrowRight" ? (index + 1) % variants.length : (index - 1 + variants.length) % variants.length;
        setVariant(variants[nextIndex].key);
    });
    render();
</script>
</body>
</html>
