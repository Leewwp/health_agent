name: CI

# Java 21 编译 + 全量测试（含真实 MySQL 集成测试）。
# MySQL 8 服务容器以 root/123456 提供，与应用默认 dev 配置一致；
# 集成测试由 -Ditest.mysql=true 门控（MysqlTransactionIntegrationTest）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: '123456'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译与全量测试（含真实 MySQL 集成测试）
        run: mvn -B -Ditest.mysql=true test

      - name: 上传测试报告（失败时排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7
