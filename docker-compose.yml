# 单实例 Nginx + Spring Boot + MySQL Compose（spec 11 身份和部署章节）。
#
# 用法：
#   1. 复制 .env 模板并填写生产必需变量（prod 缺少必要配置时启动失败是特性）：
#        cp deploy/.env.example .env
#      （DASHSCOPE_API_KEY / DIET_SESSION_SECRET / ADMIN_TOKEN 均必填，
#      占位符 "请填入自己的apiKey" 会被 ProductionConfigurationValidator 拒绝）
#   2. docker compose up -d --build
#   3. 打开 http://localhost（Nginx 托管 frontend/ 并同源反代 /api/，健康检查在 /actuator/health）
#
# Flyway 迁移前备份与回退（spec 11）：迁移前对 diet_db 执行 mysqldump；
# 发布失败时回退上一个应用镜像或前向修复，不执行破坏性自动回滚。

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: diet_db
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY 必填（真实 key，占位符会被校验拒绝），请复制 deploy/.env.example 为 .env}
      DIET_SESSION_SECRET: ${DIET_SESSION_SECRET:?DIET_SESSION_SECRET 必填，请复制 deploy/.env.example 为 .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN 必填，请复制 deploy/.env.example 为 .env}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql-data:
