# 方案 B：Nginx 同源反向代理（07 号决策，规格 11 身份和部署章节）。
#
# - `location /`：托管 frontend/ 静态前端，SPA 深链接回退到 index.html
#   （hash 路由下主要为兜底，来源：Vue Router 官方 Nginx 配置）；
# - `location /api/`：精确前缀反代 Spring Boot 后端，同源因此无 CORS，
#   匿名身份 Cookie（HEALTH_SESSION）与写操作 Origin 校验均不受影响。
#
# 本地验证示例（macOS Docker Desktop：容器内 127.0.0.1 指向容器自身，
# 需把反代目标换成 host.docker.internal 才能到达宿主机后端）：
#   sed 's/127.0.0.1:8080/host.docker.internal:8080/' deploy/nginx.conf \
#     > /tmp/nginx-local.conf
#   docker run --rm -p 8090:80 \
#     -v $PWD/frontend:/usr/share/nginx/html:ro \
#     -v /tmp/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:1.27-alpine
# 后端另起在 8081 端口时，把下方 proxy_pass 改为 http://127.0.0.1:8081。

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # 前端无构建步骤、文件名不带 hash，禁用启发式缓存避免旧资源：
        # 浏览器每次重新校验（If-Modified-Since -> 304），不影响命中率。
        add_header Cache-Control "no-cache";
    }

    # 健康检查同样经 Nginx 可达（spec 11：提供 /actuator/health 或等价健康接口）
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }

    # MCP Streamable HTTP 端点（M5 #51）：鉴权由应用内 Filter 承担（Bearer MCP_API_TOKEN）
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        # 应用截止时间 5s，代理留出少量传输余量但必须先于前端 25s 超时返回。
        proxy_connect_timeout 6s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        # 保留客户端 Host（含端口），保证写操作 Origin 校验（OriginValidationInterceptor）
        # 在非 80/443 端口部署时也能通过；$http_host 与 $host 对默认端口行为一致。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
