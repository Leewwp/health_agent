# Compose 场景专用 Nginx 配置：与 deploy/nginx.conf 的差异是反代目标为
# docker-compose 服务名 app:8080（容器网络内），其余（同源反代、Host 保端口、
# no-cache）保持一致。本地直接验证仍使用 deploy/nginx.conf（127.0.0.1:8080）。

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 健康检查同样经 Nginx 可达（spec 11：提供 /actuator/health 或等价健康接口）
    location = /actuator/health {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
    }

    # MCP Streamable HTTP 端点（M5 #51）：鉴权由应用内 Filter 承担（Bearer MCP_API_TOKEN）
    location = /mcp {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://app:8080;
        # 应用截止时间 5s，代理留出少量传输余量但必须先于前端 25s 超时返回。
        proxy_connect_timeout 6s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
